services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samawi_dating}
      POSTGRES_USER: ${POSTGRES_USER:-samawi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dating-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samawi} -d ${POSTGRES_DB:-samawi_dating}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://samawi:change-me@database:5432/samawi_dating}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dating-postgres:
